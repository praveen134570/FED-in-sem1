<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #details {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Student Management</h1>

    Student ID: <input type="text" id="id"><br><br>

    Name: <input type="text" id="name"><br><br>

    Course: <input type="text" id="course"><br><br>

    Marks: <input type="number" id="marks"><br><br>

    <button onclick="submitStudent()">Submit</button>
    <br>
    <button onclick="addStudent()">Add</button>
    <button onclick="removeStudent()">Remove</button>


    <div id="details"></div>

    <script>
        var students = JSON.parse(localStorage.getItem("students")) || [];

        function displayStudents() {
            var details = document.getElementById("details");
            details.innerHTML = "";

            students.forEach(function(student) {
                var p = document.createElement("p");

                p.setAttribute("data-id", student.id);

                p.textContent =
                    "ID: " + student.id +
                    " | Name: " + student.name +
                    " | Course: " + student.course +
                    " | Marks: " + student.marks;

                details.appendChild(p);
            });
        }

        function submitStudent() {
            var id = document.getElementById("id").value.trim();
            var name = document.getElementById("name").value.trim();
            var course = document.getElementById("course").value.trim();
            var marks = document.getElementById("marks").value;

            if (id === "" || name === "" || course === "" || marks === "") {
                alert("Please enter all student details!");
                return;
            }

            if (students.some(function(s) {
                return s.id === id;
            })) {
                alert("Student ID already exists!");
                return;
            }

            students.push({
                id: id,
                name: name,
                course: course,
                marks: marks
            });

            localStorage.setItem("students", JSON.stringify(students));

            displayStudents();

            document.getElementById("id").value = "";
            document.getElementById("name").value = "";
            document.getElementById("course").value = "";
            document.getElementById("marks").value = "";

            alert("Student submitted successfully!");
        }

        function addStudent() {
            submitStudent();
        }

        function removeStudent() {
            var id = document.getElementById("id").value.trim();

            if (id === "") {
                alert("Enter the Student ID to remove!");
                return;
            }

            var oldLength = students.length;

            students = students.filter(function(student) {
                return student.id !== id;
            });

            if (students.length === oldLength) {
                alert("Student ID not found!");
                return;
            }

            localStorage.setItem("students", JSON.stringify(students));

            displayStudents();

            document.getElementById("id").value = "";

            alert("Student removed successfully!");
        }

        displayStudents();
    </script>

</body>
</html>
